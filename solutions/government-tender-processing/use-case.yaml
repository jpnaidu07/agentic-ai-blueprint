schema_version: 1
name: government-tender-processing
title: Government Tender Intelligence & Bid Evaluation Platform
problem: Evaluation committees must inspect many technical and commercial PDF bids
  against published criteria. Manual comparisons lose evidence provenance, consume
  time and risk inconsistent decisions.
objectives:
- Reduce document triage effort while retaining committee authority over procurement.
- Make every accepted fact, deterministic score and human decision reconstructible.
personas:
- Procurement administrator creates tenders and the published scoring policy.
- Evaluator uploads bids, verifies extracted facts and creates evaluations.
- Independent committee reviewer approves or rejects a complete evaluation.
- Auditor reads authorized evidence and verifies event history.
journeys:
- Administrator records frozen criteria and closing date; evaluator adds bidders and
  digital PDFs.
- Evaluator opens page evidence, accepts or corrects facts, and calculates deterministic
  scores.
- Reviewer checks the current evidence revision and records a reasoned independent
  decision.
- Auditor reconstructs the policy, document digest, fact revisions and decision from
  retained records.
requirements:
- id: CAP-DATA
  objective: Persist tenders, bids, evidence revisions and audit records with foreign
    keys and transactional integrity.
  acceptance:
  - Verify schema creation, foreign keys, unique evaluation keys and transactional
    rollback against the selected development database.
  - Document migration and backup/restore prerequisites separately from SQLite test
    evidence.
  skill: database
  depends_on: []
  blueprint_modules:
  - 5
- id: CAP-IDENTITY
  objective: Enforce authenticated roles and tender scope on every operation including
    documents, searches and audit access.
  acceptance:
  - Missing or invalid bearer tokens are rejected.
  - Cross-tender document IDs and bid IDs never reveal evidence.
  - An evaluator cannot approve their own work, including after a role change.
  skill: security
  depends_on:
  - CAP-DATA
  blueprint_modules: []
- id: CAP-INGEST
  objective: Validate digital PDF uploads, extract page-aware text and segment evidence
    without losing provenance.
  acceptance:
  - Reject malformed, oversized, encrypted, interactive and scanned-only PDFs with
    an actionable response.
  - Uploading identical bytes within the same tender and bid scope returns the existing
    document.
  - Retain original bytes, SHA-256, page text, chunk offsets and scanner status.
  skill: backend
  depends_on:
  - CAP-DATA
  - CAP-IDENTITY
  blueprint_modules:
  - 1
  - 4
  - 5
- id: CAP-FACTS
  objective: Propose numeric requirement observations through configurable models
    and accept only explicitly reviewed evidence.
  acceptance:
  - Model output cannot accept facts or approve procurement decisions.
  - Every accepted fact cites an existing page and exact quote in that bidder's document.
  - Missing evidence or invalid model JSON fails without creating facts.
  skill: agents
  depends_on:
  - CAP-INGEST
  blueprint_modules: []
- id: CAP-SCORE
  objective: Calculate published weighted scores, eligibility gates, L1 comparison
    and equal ranks for ties deterministically.
  acceptance:
  - Scored weights total exactly 100 and mandatory eligibility has zero score weight.
  - Missing evidence, low confidence or nonpositive commercial totals block ranking.
  - Ineligible bids cannot set the commercial baseline or receive a rank.
  skill: backend
  depends_on:
  - CAP-FACTS
  blueprint_modules:
  - 1
  - 4
  - 6
- id: CAP-REVIEW
  objective: Persist versioned evaluations, reject stale approvals and require independent
    human decisions.
  acceptance:
  - Repeating an evaluation key with unchanged inputs returns the same result.
  - Reusing the key after evidence changes returns a conflict.
  - A reviewer cannot approve incomplete or stale evidence; approval freezes the reference
    evaluation.
  skill: backend
  depends_on:
  - CAP-SCORE
  - CAP-IDENTITY
  blueprint_modules:
  - 4
  - 5
  - 6
- id: CAP-SEARCH
  objective: Retrieve tender-scoped page evidence using lexical search and expose
    a hybrid retrieval extension.
  acceptance:
  - Unknown queries return insufficient evidence without invented answers.
  - Search results contain document, page, section, bidder and tender identifiers.
  - Structured bidder counts and rankings come from SQL and scoring snapshots, not
    vector similarity.
  skill: rag
  depends_on:
  - CAP-INGEST
  blueprint_modules: []
- id: CAP-PORTAL
  objective: Provide an accessible portfolio and tender dashboard with evidence review,
    scores, risk flags and audit history.
  acceptance:
  - Show active, closed, low-participation and approved tenders from actual records.
  - Render untrusted names, documents and model outputs as text, never HTML.
  - Display stale revisions and missing evidence next to scores and approval controls.
  skill: frontend
  depends_on:
  - CAP-REVIEW
  - CAP-SEARCH
  blueprint_modules: []
- id: CAP-OPS
  objective: Run the development reference on a 32 GB Windows laptop using bounded
    containers and explicit prerequisites.
  acceptance:
  - Core Compose requires no local LLM and publishes application ports on loopback
    only.
  - Setup detects Docker and credentials, creates unique local identities and never
    installs host system services silently.
  - Provide reproducible tests, evaluation datasets, schema and link validation in
    CI.
  skill: infrastructure
  depends_on:
  - CAP-PORTAL
  blueprint_modules: []
business_rules:
- Procurement rules are supplied and approved by the organisation; included numeric
  policies are illustrative, not legal guidance.
- Eligibility is mandatory; scored weights total 100; lower commercial totals normalize
  against the lowest complete eligible bid.
- Every score uses reviewed, typed evidence; model confidence is not a calibrated
  probability.
- Confidence below 0.8 blocks ranking in this reference and must be calibrated before
  deployment.
- A committee decision accepts or rejects an evaluation; the system never issues a
  contract award.
- Tender-level access applies to all documents; documents inherit that ACL. Bidder
  self-service and finer document ACLs need an extension.
inputs:
- Published tender criteria, weights, targets, normalization, agency, currency and
  closing date.
- Bidder identity and digital technical/commercial PDF documents.
- Human-reviewed fact values with exact quotes, pages, confidence and review rationale.
outputs:
- Structured tenders, bids, documents, immutable fact revisions and evaluation snapshots.
- Deterministic technical/commercial scoring breakdown, ranking ties, L1 flag and
  unresolved evidence.
- Independent review decisions and a verifiable append-only event chain.
security:
- Role and tender authorization precede retrieval, extraction and scoring.
- Tokens are configured by SHA-256 digest; secrets and raw documents are excluded
  from application logs.
- Fail closed for non-development uploads without a configured scanner.
- Treat bidder text as untrusted data; tool permissions and business rules remain
  server-side.
compliance:
- Not certified for any jurisdiction. Procurement officers must approve rules, retention,
  residency and appeal procedures.
- Production requires organizational identity, encrypted storage, TLS, external audit
  anchoring and restore validation.
data_sensitivity: Confidential government procurement information; use synthetic documents
  until controls are independently approved.
scale: Reference target 100 tenders with up to 50 bids each; digital PDFs up to 10
  MiB and 250 pages. These are design targets, not validated capacity claims.
nonfunctional:
- No lost approval history and no overwrite of accepted facts.
- Transactionally bind evaluations to the exact evidence and policy revision.
- Explicitly report unavailable models, missing scanners and unsupported document
  formats.
- Local core services stay below a configured 4 GiB memory budget, leaving headroom
  on a 32 GB laptop.
human_approvals:
- Domain expert approves policy and data handling before production.
- Evaluator verifies every fact before scoring; an independent reviewer decides the
  evaluation.
failures:
- Malformed/encrypted/scanned PDFs, parser exhaustion, scanner unavailable or detected
  malware.
- Provider timeout, refusal, hallucinated quote, invalid schema or prompt injection.
- Missing evidence, cross-tender reference, conflicting facts, duplicate requests
  or stale approval.
deployment: Docker Compose application plus PostgreSQL for development; optional local
  Ollama. SQLite is supported for tests and a single-process local demo.
model_selection: Default to an explicitly configured cloud provider after residency
  approval; require structured-output capability and evaluate extraction on golden
  evidence. Support OpenAI, Azure, Anthropic and Gemini compatibility endpoints plus
  optional Ollama. Do not hard-code a model, price, or benchmark claim.
open_questions: []
