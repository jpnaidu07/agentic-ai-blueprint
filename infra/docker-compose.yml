version: '3.8'

services:
  agent-backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: agentic-ai-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=auto
      - OLLAMA_BASE_URL=http://ollama-service:11434
    depends_on:
      - ollama-service
    volumes:
      - ../agent_audit.sqlite:/app/agent_audit.sqlite
    restart: unless-stopped

  ollama-service:
    image: ollama/ollama:latest
    container_name: agentic-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
