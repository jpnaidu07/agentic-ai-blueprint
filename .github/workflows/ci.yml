name: validated-reference
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m ruff check src scripts
      - run: python -m ruff format --check src scripts
      - run: python -m pytest -q
      - run: python -m src.evals.eval_harness
      - run: python -m scripts.validate_repo
      - run: python -m pip_audit -r requirements.txt
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up --wait
      - run: curl --fail --silent --show-error http://127.0.0.1:8000/api/health
      - if: always()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down --volumes
