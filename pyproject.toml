[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-blueprint"
version = "0.4.0"
description = "Spec-first agent engineering and an evidence-based tender reference"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
agent-blueprint = "src.blueprint.cli:main"
blueprint-workbench = "src.workbench.server:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
"src" = ["ui/*", "tender/ui/*", "workbench/ui/*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
